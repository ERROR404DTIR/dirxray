<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".4"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="220" fill="#0b1020"/>
    <g fill="url(#g)" opacity=".35">
      <rect x="600" y="150" width="28" height="40">
        <animate attributeName="height" values="40;120;40" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="150;70;150" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="640" y="150" width="28" height="40">
        <animate attributeName="height" values="70;30;70" dur="3.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="120;160;120" dur="3.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="680" y="150" width="28" height="40">
        <animate attributeName="height" values="30;100;30" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="160;90;160" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="720" y="150" width="28" height="40">
        <animate attributeName="height" values="90;50;90" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="100;140;100" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="760" y="150" width="28" height="40">
        <animate attributeName="height" values="50;110;50" dur="2.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="140;80;140" dur="2.9s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="-140" y="0" width="140" height="220" fill="url(#scan)">
      <animate attributeName="x" values="-140;900" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="48" y="112" font-family="Consolas, Menlo, monospace" font-size="64" font-weight="700" fill="url(#g)">dirxray</text>
    <rect x="318" y="66" width="6" height="52" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="156" font-family="Consolas, Menlo, monospace" font-size="20" fill="#94a3b8">X-ray any folder. One Python file. Zero installs.</text>
  </g>
</svg>
