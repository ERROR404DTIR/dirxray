<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">DirXray</title><desc id="d">A folder is scanned and transformed into a structured project map.</desc><defs><linearGradient id="bg"><stop stop-color="#1a263c"/><stop offset="1" stop-color="#0a101d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><path d="M100 105H235L260 130H390V220H100Z" fill="#172e47" stroke="#62e3c1" stroke-width="3"/><g stroke="#8fa8ff" stroke-width="3" fill="none"><path d="M390 162H520M520 162V95H650M520 162H650M520 162V230H650"/></g><g fill="#172b44" stroke="#8fa8ff" stroke-width="2"><rect x="650" y="65" width="170" height="58" rx="9"/><rect x="650" y="133" width="170" height="58" rx="9"/><rect x="650" y="201" width="170" height="58" rx="9"/></g><g fill="#edf3ff" font-family="monospace" font-size="14"><text x="130" y="170">PROJECT</text><text x="680" y="100">LANGUAGES</text><text x="680" y="168">DUPLICATES</text><text x="680" y="236">REPORT</text></g><circle r="6" fill="#62e3c1"><animateMotion dur="3s" repeatCount="indefinite" path="M390 162H520V95H650"/></circle><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">DIRXRAY</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">SCAN / UNDERSTAND / REPORT</text></svg>